{% extends "accounts/base.html" %}
{% block title %}Register | Studyroom{% endblock %}
{% block content %}
    <h1>Create a student account</h1>
    <p>Teachers receive their accounts from the site administrator.</p>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Create account</button>
    </form>
{% endblock %}
