{% extends "accounts/base.html" %}
{% block title %}Log in | Studyroom{% endblock %}
{% block content %}
    <h1>Log in</h1>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.as_div }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
{% endblock %}
