{% extends "accounts/base.html" %}
{% block title %}Create course | Studyroom{% endblock %}
{% block content %}
    <h1>Create a course</h1>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Create course</button>
        <a href="{% url 'courses:list' %}">Cancel</a>
    </form>
{% endblock %}
