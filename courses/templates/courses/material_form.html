{% extends "accounts/base.html" %}
{% block title %}Upload material | {{ course.title }}{% endblock %}
{% block content %}
    <p><a href="{% url 'courses:detail' course.pk %}">{{ course.title }}</a></p>
    <h1>Upload course material</h1>
    <form method="post" enctype="multipart/form-data" class="account-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Upload material</button>
    </form>
{% endblock %}
