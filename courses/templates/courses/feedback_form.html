{% extends "accounts/base.html" %}
{% block title %}Your feedback | {{ course.title }}{% endblock %}
{% block content %}
    <p><a href="{% url 'courses:detail' course.pk %}">{{ course.title }}</a></p>
    <h1>Course feedback</h1>
    <p>Your feedback is visible to other members. You can return here to update it.</p>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Save feedback</button>
    </form>
{% endblock %}
